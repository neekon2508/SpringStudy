<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Tester</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript">
        let ping;
        let websocket;
        let supportsWebSockets = 'WebSocket' in window || 'MozWebSocket' in window;

       jQuery(function ($) {
             $("#connect").attr("disabled", true);
            if (supportsWebSockets) {
                console.log(">> webSocket protocol supported.")
                $("#connect").attr("disabled", false);
            }
            function writePing(message) {
                $('#pingOutput').append(message + '\n');
            }
            function writeMessage(message) {
                $('#messageOutput').append(message + '\n')
            }
            $('#connect')
                .click(function doConnect() {
                    websocket = new WebSocket($("#target").val());
                    websocket.onopen = function (evt) {
                         let badge=  $("#badgeStatus");
                         badge.text("Connected");
                         badge.attr('class','badge bg-success');
                         setInterval(function () {
                            if (websocket !== "undefined") {
                                websocket.send("ping");
                            }
                        }, 3000);
                    };
                    websocket.onclose = function (evt) {
                        let badge=  $("#badgeStatus");
                        badge.text("Disconnected");
                        badge.attr('class','badge bg-light');
                    };
                    websocket.onmessage = function (evt) {
                        if (evt.data === "ping") {
                            writePing(evt.data);
                        } else {
                            writeMessage('ECHO: ' + evt.data);
                        }
                    };
                    websocket.onerror = function (evt) {
                        onError(writeStatus('ERROR:' + evt.data))
                    };
                });
            $('#disconnect')
                .click(function () {
                    if (typeof websocket != 'undefined') {
                        websocket.close();
                        websocket = undefined;
                    } else {
                        alert("Not connected.");
                    }
                });
            $('#send')
                .click(function () {
                    if (typeof websocket != 'undefined') {
                        websocket.send($('#message').val());
                    } else {
                        alert("Not connected.");
                    }
                });
        });
</script>
</head>
<body>
<div class="container">
    <!-- Header/Menu có thể hardcode -->
    <header>
        <h1>Page Header</h1>
    </header>
    <header>
        <nav>Page Menu</nav>
    </header>

    <section>
        <div class="card border-success mb-3" style="max-width: 40rem;">
            <div class="card-header">WebSocket Tester</div>

            <!-- Target -->
            <div class="row mb-1 m-sm-1">
                <label for="target" class="col-sm-4 form-label">Target</label>
                <div class="col-sm-8">
                    <input type="text" id="target" size="40"
                           value="ws://localhost:8080/ws/echo"
                           class="form-control"/>
                </div>
            </div>

            <!-- Connect / Disconnect -->
            <div class="row mb-1 m-sm-1">
                <div class="col-sm-2">
                    <input type="submit" id="connect" class="btn btn-success" value="Connect"/>
                </div>
                <div class="col-sm-2">
                    <input type="submit" id="disconnect" class="btn btn-danger" value="Disconnect"/>
                </div>
                <div class="col-sm-2"><span id="badgeStatus"></span></div>
            </div>

            <!-- Message input -->
            <div class="row mb-1 m-sm-1">
                <label for="message" class="col-sm-4 form-label">Message</label>
                <div class="col-sm-8">
                    <input type="text" id="message" value="" class="form-control"/>
                </div>
            </div>

            <!-- Send button -->
            <div class="row mb-1 m-sm-1">
                <div class="col-sm-2">
                    <input type="submit" id="send" value="Send" class="btn btn-dark"/>
                </div>
            </div>

            <!-- Message output -->
            <div class="row mb-1 m-sm-1">
                <label for="messageOutput" class="col-sm-4 form-label">Echo</label>
                <div class="col-sm-7">
                    <textarea id="messageOutput" rows="5" cols="25" class="form-control"></textarea>
                </div>
            </div>

            <!-- Ping output -->
            <div class="row mb-1 m-sm-1">
                <label for="pingOutput" class="col-sm-4 form-label">Ping</label>
                <div class="col-sm-7">
                    <textarea id="pingOutput" rows="5" cols="25" class="form-control"></textarea>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>Page Footer</p>
    </footer>
</div>
</body>
</html>
